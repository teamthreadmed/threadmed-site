<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif"><rect width="900" height="560" fill="#fff"/><text x="450" y="40" font-size="26" font-weight="bold" fill="#1f2d3d" text-anchor="middle">How falling estrogen shows up in the body</text><g fill="#b5654a"><circle cx="450" cy="120" r="30"/><rect x="438" y="148" width="24" height="16"/><path d="M400 165 Q450 155 500 165 L520 300 L495 300 L485 215 L480 330 L500 520 L470 520 L452 380 L448 380 L430 520 L400 520 L420 330 L415 215 L405 300 L380 300 Z"/></g><line x1="288" y1="105" x2="425" y2="115" stroke="#c9a99c" stroke-width="1.5"/><circle cx="425" cy="115" r="4" fill="#1f2d3d"/><text x="280" y="102" font-size="15" font-weight="bold" fill="#1f2d3d" text-anchor="end">Brain</text><text x="280" y="120" font-size="13" fill="#1f2d3d" text-anchor="end">Brain fog, poorer sleep</text><line x1="632" y1="105" x2="475" y2="115" stroke="#c9a99c" stroke-width="1.5"/><circle cx="475" cy="115" r="4" fill="#1f2d3d"/><text x="640" y="102" font-size="15" font-weight="bold" fill="#1f2d3d" text-anchor="start">Mood</text><text x="640" y="120" font-size="13" fill="#1f2d3d" text-anchor="start">Low mood, anxiety,</text><text x="640" y="136" font-size="13" fill="#1f2d3d" text-anchor="start">irritability</text><line x1="288" y1="195" x2="430" y2="175" stroke="#c9a99c" stroke-width="1.5"/><circle cx="430" cy="175" r="4" fill="#1f2d3d"/><text x="280" y="192" font-size="15" font-weight="bold" fill="#1f2d3d" text-anchor="end">Vasomotor</text><text x="280" y="210" font-size="13" fill="#1f2d3d" text-anchor="end">Hot flashes and night sweats</text><line x1="632" y1="195" x2="465" y2="125" stroke="#c9a99c" stroke-width="1.5"/><circle cx="465" cy="125" r="4" fill="#1f2d3d"/><text x="640" y="192" font-size="15" font-weight="bold" fill="#1f2d3d" text-anchor="start">Eyes and mouth</text><text x="640" y="210" font-size="13" fill="#1f2d3d" text-anchor="start">Dryness</text><line x1="288" y1="285" x2="410" y2="230" stroke="#c9a99c" stroke-width="1.5"/><circle cx="410" cy="230" r="4" fill="#1f2d3d"/><text x="280" y="282" font-size="15" font-weight="bold" fill="#1f2d3d" text-anchor="end">Hair and skin</text><text x="280" y="300" font-size="13" fill="#1f2d3d" text-anchor="end">Thinning hair, drier skin,</text><text x="280" y="316" font-size="13" fill="#1f2d3d" text-anchor="end">less collagen</text><line x1="632" y1="285" x2="470" y2="210" stroke="#c9a99c" stroke-width="1.5"/><circle cx="470" cy="210" r="4" fill="#1f2d3d"/><text x="640" y="282" font-size="15" font-weight="bold" fill="#1f2d3d" text-anchor="start">Heart and metabolism</text><text x="640" y="300" font-size="13" fill="#1f2d3d" text-anchor="start">LDL rises; fat shifts to the</text><text x="640" y="316" font-size="13" fill="#1f2d3d" text-anchor="start">abdomen</text><line x1="288" y1="395" x2="435" y2="400" stroke="#c9a99c" stroke-width="1.5"/><circle cx="435" cy="400" r="4" fill="#1f2d3d"/><text x="280" y="392" font-size="15" font-weight="bold" fill="#1f2d3d" text-anchor="end">Bone</text><text x="280" y="410" font-size="13" fill="#1f2d3d" text-anchor="end">Fastest bone loss in the first</text><text x="280" y="426" font-size="13" fill="#1f2d3d" text-anchor="end">5–7 years</text><line x1="632" y1="395" x2="452" y2="330" stroke="#c9a99c" stroke-width="1.5"/><circle cx="452" cy="330" r="4" fill="#1f2d3d"/><text x="640" y="392" font-size="15" font-weight="bold" fill="#1f2d3d" text-anchor="start">Genitourinary</text><text x="640" y="410" font-size="13" fill="#1f2d3d" text-anchor="start">Vaginal dryness, painful sex,</text><text x="640" y="426" font-size="13" fill="#1f2d3d" text-anchor="start">urinary urgency and infections</text><line x1="288" y1="485" x2="420" y2="470" stroke="#c9a99c" stroke-width="1.5"/><circle cx="420" cy="470" r="4" fill="#1f2d3d"/><text x="280" y="482" font-size="15" font-weight="bold" fill="#1f2d3d" text-anchor="end">Joints and muscle</text><text x="280" y="500" font-size="13" fill="#1f2d3d" text-anchor="end">Aches; muscle mass declines</text><text x="888" y="550" font-size="11" fill="#6b7785" text-anchor="end">Thread Medicine · original schematic</text></svg>