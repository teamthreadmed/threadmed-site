3d">Age (years)</text><text x="712" y="60" font-size="12" fill="#1f2d3d" text-anchor="middle">T-score</text><text x="122" y="152.14285714285714" font-size="14" font-weight="bold" fill="#1f2d3d">Normal  (T ≥ −1.0)</text><text x="122" y="267.8571428571429" font-size="14" font-weight="bold" fill="#1f2d3d">Low bone mass / osteopenia  (−1.0 to −2.5)</text><text x="122" y="373.2857142857143" font-size="14" font-weight="bold" fill="#1f2d3d">Osteoporosis  (T ≤ −2.5)</text><text x="740" y="90" font-size="15" font-weight="bold" fill="#1f2d3d">Sites that count</text><text x="740" y="116" font-size="13" fill="#1f2d3d">• Lumbar spine L1–L4</text><text x="740" y="136" font-size="13" fill="#1f2d3d">• Total hip</text><text x="740" y="156" font-size="13" fill="#1f2d3d">• Femoral neck</text><text x="740" y="176" font-size="13" fill="#1f2d3d">• 1/3 radius (if spine or hip</text><text x="740" y="196" font-size="13" fill="#1f2d3d">  cannot be read)</text><text x="740" y="240" font-size="15" font-weight="bold" fill="#1f2d3d">The rule</text><text x="740" y="266" font-size="13" fill="#1f2d3d">Diagnosis uses the lowest</text><text x="740" y="284" font-size="13" fill="#1f2d3d">T-score of these sites.</text><text x="740" y="302" font-size="13" fill="#1f2d3d">A hip or spine fragility</text><text x="740" y="320" font-size="13" fill="#1f2d3d">fracture means osteoporosis</text><text x="740" y="338" font-size="13" fill="#1f2d3d">whatever the T-score.</text><text x="948" y="470" font-size="11" fill="#6b7785" text-anchor="end">Thread Medicine · original schematic</text></svg>