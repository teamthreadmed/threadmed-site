<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Helvetica, Arial, sans-serif"><rect width="960" height="500" fill="#fff"/><text x="480" y="36" font-size="24" font-weight="bold" fill="#1f2d3d" text-anchor="middle">Coronary artery calcium (CAC) score</text><text x="480" y="60" font-size="13" fill="#6b7785" text-anchor="middle">Non-contrast CT counts calcified plaque in the heart arteries. Calcium is a footprint of plaque, not all of it.</text><rect x="20" y="80" width="220" height="200" rx="6" fill="#111"/><ellipse cx="130" cy="185" rx="78" ry="62" fill="#7d7d7d"/><circle cx="120" cy="127" r="22" fill="#8a8a8a"/><circle cx="182" cy="251" r="16" fill="#8a8a8a"/><path d="M70 165 Q100 137 140 145 Q180 155 196 185" fill="none" stroke="#5c5c5c" stroke-width="5"/><rect x="20" y="295" width="220" height="40" rx="6" fill="#eef3fb"/><text x="130" y="321" font-size="20" font-weight="bold" fill="#1f2d3d" text-anchor="middle">0</text><text x="130" y="360" font-size="15" font-weight="bold" fill="#1f2d3d" text-anchor="middle">No calcified plaque</text><text x="130" y="382" font-size="13" fill="#1f2d3d" text-anchor="middle">Low near-term risk. Statin</text><text x="130" y="399" font-size="13" fill="#1f2d3d" text-anchor="middle">can often be deferred,</text><text x="130" y="416" font-size="13" fill="#1f2d3d" text-anchor="middle">except with diabetes,</text><text x="130" y="433" font-size="13" fill="#1f2d3d" text-anchor="middle">smoking, familial</text><text x="130" y="450" font-size="13" fill="#1f2d3d" text-anchor="middle">hypercholesterolemia or</text><text x="130" y="467" font-size="13" fill="#1f2d3d" text-anchor="middle">strong family history</text><rect x="255" y="80" width="220" height="200" rx="6" fill="#111"/><ellipse cx="365" cy="185" rx="78" ry="62" fill="#7d7d7d"/><circle cx="355" cy="127" r="22" fill="#8a8a8a"/><circle cx="417" cy="251" r="16" fill="#8a8a8a"/><path d="M305 165 Q335 137 375 145 Q415 155 431 185" fill="none" stroke="#5c5c5c" stroke-width="5"/><ellipse cx="313.4" cy="152.6" rx="4.2" ry="2.2" fill="#fafafa"/><ellipse cx="319.4" cy="151.8" rx="5.8" ry="3.2" fill="#fafafa"/><ellipse cx="330.6" cy="148.4" rx="4.6" ry="2.4" fill="#fafafa"/><rect x="255" y="295" width="220" height="40" rx="6" fill="#eef3fb"/><text x="365" y="321" font-size="20" font-weight="bold" fill="#1f2d3d" text-anchor="middle">1–99</text><text x="365" y="360" font-size="15" font-weight="bold" fill="#1f2d3d" text-anchor="middle">Mild</text><text x="365" y="382" font-size="13" fill="#1f2d3d" text-anchor="middle">Plaque is present. Treatment</text><text x="365" y="399" font-size="13" fill="#1f2d3d" text-anchor="middle">is generally favored,</text><text x="365" y="416" font-size="13" fill="#1f2d3d" text-anchor="middle">especially from age 55</text><rect x="490" y="80" width="220" height="200" rx="6" fill="#111"/><ellipse cx="600" cy="185" rx="78" ry="62" fill="#7d7d7d"/><circle cx="590" cy="127" r="22" fill="#8a8a8a"/><circle cx="652" cy="251" r="16" fill="#8a8a8a"/><path d="M540 165 Q570 137 610 145 Q650 155 666 185" fill="none" stroke="#5c5c5c" stroke-width="5"/><ellipse cx="548.0" cy="152.6" rx="3.6" ry="3.4" fill="#fafafa"/><ellipse cx="559.0" cy="154.2" rx="5.4" ry="2.3" fill="#fafafa"/><ellipse cx="562.9" cy="150.8" rx="5.2" ry="3.3" fill="#fafafa"/><ellipse cx="573.3" cy="145.8" rx="4.8" ry="3.0" fill="#fafafa"/><ellipse cx="578.0" cy="145.3" rx="4.4" ry="2.1" fill="#fafafa"/><ellipse cx="587.6" cy="149.2" rx="4.6" ry="2.5" fill="#fafafa"/><ellipse cx="594.5" cy="148.2" rx="5.6" ry="3.3" fill="#fafafa"/><ellipse cx="599.1" cy="148.7" rx="4.8" ry="2.6" fill="#fafafa"/><rect x="490" y="295" width="220" height="40" rx="6" fill="#eef3fb"/><text x="600" y="321" font-size="20" font-weight="bold" fill="#1f2d3d" text-anchor="middle">100–299</text><text x="600" y="360" font-size="15" font-weight="bold" fill="#1f2d3d" text-anchor="middle">Moderate</text><text x="600" y="382" font-size="13" fill="#1f2d3d" text-anchor="middle">Treat with a statin; risk</text><text x="600" y="399" font-size="13" fill="#1f2d3d" text-anchor="middle">similar to the high-risk</text><text x="600" y="416" font-size="13" fill="#1f2d3d" text-anchor="middle">group</text><rect x="725" y="80" width="220" height="200" rx="6" fill="#111"/><ellipse cx="835" cy="185" rx="78" ry="62" fill="#7d7d7d"/><circle cx="825" cy="127" r="22" fill="#8a8a8a"/><circle cx="887" cy="251" r="16" fill="#8a8a8a"/><path d="M775 165 Q805 137 845 145 Q885 155 901 185" fill="none" stroke="#5c5c5c" stroke-width="5"/><ellipse cx="783.0" cy="153.8" rx="5.4" ry="2.1" fill="#fafafa"/><ellipse cx="789.3" cy="153.1" rx="3.8" ry="2.8" fill="#fafafa"/><ellipse cx="798.8" cy="149.1" rx="6.0" ry="2.3" fill="#fafafa"/><ellipse cx="805.5" cy="146.5" rx="4.9" ry="2.4" fill="#fafafa"/><ellipse cx="812.1" cy="148.7" rx="4.0" ry="2.8" fill="#fafafa"/><ellipse cx="822.4" cy="144.6" rx="3.2" ry="2.3" fill="#fafafa"/><ellipse cx="828.6" cy="148.4" rx="3.7" ry="2.5" fill="#fafafa"/><ellipse cx="832.1" cy="149.0" rx="3.1" ry="3.0" fill="#fafafa"/><ellipse cx="843.4" cy="154.1" rx="5.2" ry="3.4" fill="#fafafa"/><ellipse cx="845.1" cy="152.6" rx="5.9" ry="3.2" fill="#fafafa"/><ellipse cx="854.5" cy="159.2" rx="4.9" ry="3.2" fill="#fafafa"/><ellipse cx="860.8" cy="157.2" rx="4.3" ry="2.2" fill="#fafafa"/><ellipse cx="868.3" cy="163.8" rx="4.0" ry="2.0" fill="#fafafa"/><ellipse cx="873.3" cy="160.4" rx="5.4" ry="2.5" fill="#fafafa"/><ellipse cx="881.7" cy="160.6" rx="5.9" ry="2.6" fill="#fafafa"/><ellipse cx="888.2" cy="160.0" rx="3.2" ry="2.3" fill="#fafafa"/><ellipse cx="898.1" cy="159.4" rx="3.1" ry="2.7" fill="#fafafa"/><ellipse cx="902.5" cy="162.6" rx="3.4" ry="2.8" fill="#fafafa"/><rect x="725" y="295" width="220" height="40" rx="6" fill="#eef3fb"/><text x="835" y="321" font-size="20" font-weight="bold" fill="#1f2d3d" text-anchor="middle">≥ 300</text><text x="835" y="360" font-size="15" font-weight="bold" fill="#1f2d3d" text-anchor="middle">Extensive</text><text x="835" y="382" font-size="13" fill="#1f2d3d" text-anchor="middle">High risk. At ≥ 1000 the</text><text x="835" y="399" font-size="13" fill="#1f2d3d" text-anchor="middle">2026 guideline sets the</text><text x="835" y="416" font-size="13" fill="#1f2d3d" text-anchor="middle">LDL-C goal below 55 mg/dL</text><text x="948" y="490" font-size="11" fill="#6b7785" text-anchor="end">Thread Medicine · original schematic</text></svg>