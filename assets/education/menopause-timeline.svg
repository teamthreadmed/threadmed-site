888.8,235.6 891.6,235.6 894.4,235.6 897.2,235.6 900.0,235.6" fill="none" stroke="#c0392b" stroke-width="3"/><text x="70" y="140" font-size="13" fill="#c0392b">Estradiol</text><text x="298.0" y="112" font-size="12" fill="#1f2d3d">Erratic swings, not a steady fall</text><line x1="508" y1="90" x2="508" y2="300" stroke="#1f2d3d" stroke-dasharray="4 4"/><text x="514" y="98" font-size="12" fill="#1f2d3d">Final menstrual period</text><line x1="60" y1="300" x2="900" y2="300" stroke="#1f2d3d"/><line x1="60" y1="300" x2="60" y2="306" stroke="#1f2d3d"/><text x="60" y="322" font-size="13" text-anchor="middle" fill="#1f2d3d">35</text><line x1="200" y1="300" x2="200" y2="306" stroke="#1f2d3d"/><text x="200" y="322" font-size="13" text-anchor="middle" fill="#1f2d3d">40</text><line x1="340" y1="300" x2="340" y2="306" stroke="#1f2d3d"/><text x="340" y="322" font-size="13" text-anchor="middle" fill="#1f2d3d">45</text><line x1="480" y1="300" x2="480" y2="306" stroke="#1f2d3d"/><text x="480" y="322" font-size="13" text-anchor="middle" fill="#1f2d3d">50</text><line x1="620" y1="300" x2="620" y2="306" stroke="#1f2d3d"/><text x="620" y="322" font-size="13" text-anchor="middle" fill="#1f2d3d">55</text><line x1="760" y1="300" x2="760" y2="306" stroke="#1f2d3d"/><text x="760" y="322" font-size="13" text-anchor="middle" fill="#1f2d3d">60</text><line x1="900" y1="300" x2="900" y2="306" stroke="#1f2d3d"/><text x="900" y="322" font-size="13" text-anchor="middle" fill="#1f2d3d">65</text><text x="480" y="338" font-size="12" fill="#6b7785" text-anchor="middle">Age (years)</text><rect x="60" y="345" width="280" height="34" fill="#e07a5f"/><rect x="340" y="345" width="168" height="34" fill="#3d85c6"/><rect x="508" y="345" width="28" height="34" fill="#222"/><rect x="536" y="345" width="364" height="34" fill="#f0a58f"/><text x="150" y="400" font-size="15" font-weight="bold" fill="#e07a5f" text-anchor="middle">Reproductive</text><text x="150" y="420" font-size="13" fill="#1f2d3d" text-anchor="middle">Regular cycles; fertility</text><text x="150" y="437" font-size="13" fill="#1f2d3d" text-anchor="middle">declining from mid-30s</text><text x="330" y="400" font-size="15" font-weight="bold" fill="#3d85c6" text-anchor="middle">Perimenopause</text><text x="330" y="420" font-size="13" fill="#1f2d3d" text-anchor="middle">Cycle length changes, then</text><text x="330" y="437" font-size="13" fill="#1f2d3d" text-anchor="middle">skipped periods. Hot</text><text x="330" y="454" font-size="13" fill="#1f2d3d" text-anchor="middle">flashes, sleep and mood</text><text x="330" y="471" font-size="13" fill="#1f2d3d" text-anchor="middle">changes often start</text><text x="560" y="400" font-size="15" font-weight="bold" fill="#1f2d3d" text-anchor="middle">Menopause</text><text x="560" y="420" font-size="13" fill="#1f2d3d" text-anchor="middle">Defined after 12 months</text><text x="560" y="437" font-size="13" fill="#1f2d3d" text-anchor="middle">with no period</text><text x="800" y="400" font-size="15" font-weight="bold" fill="#f0a58f" text-anchor="middle">Postmenopause</text><text x="800" y="420" font-size="13" fill="#1f2d3d" text-anchor="middle">Hot flashes can last 7–10</text><text x="800" y="437" font-size="13" fill="#1f2d3d" text-anchor="middle">years. Bone loss, vaginal</text><text x="800" y="454" font-size="13" fill="#1f2d3d" text-anchor="middle">dryness and urinary</text><text x="800" y="471" font-size="13" fill="#1f2d3d" text-anchor="middle">symptoms emerge</text><line x1="508" y1="340" x2="508" y2="374" stroke="#fff" stroke-width="0"/><text x="948" y="510" font-size="11" fill="#6b7785" text-anchor="end">Thread Medicine · original schematic</text></svg>