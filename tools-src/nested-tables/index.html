<html lang="en">
<head>

<title>Nested Tables</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

  td.c1{background:#fde7e7} td.c2{background:#fdeedc} td.c3{background:#fbf6d5} td.c4{background:#e2f3e4} td.c5{background:#dcefef} td.c6{background:#e1e9fb} td.c7{background:#ece3f7} td.c8{background:#f6e1ee}
  :root[data-theme="dark"] td.c1{background:#3b2626} :root[data-theme="dark"] td.c2{background:#3b2f22} :root[data-theme="dark"] td.c3{background:#38351f} :root[data-theme="dark"] td.c4{background:#223726} :root[data-theme="dark"] td.c5{background:#1f3536} :root[data-theme="dark"] td.c6{background:#232c40} :root[data-theme="dark"] td.c7{background:#2e2540} :root[data-theme="dark"] td.c8{background:#3a2432}
  .cell .tools .cbtn{opacity:0;font-size:11.5px;cursor:pointer;padding:3px 6px;border-radius:6px;color:var(--muted);border:1px solid transparent;font-family:"JetBrains Mono",monospace}

  .cell .tools .cbtn:hover{border-color:var(--line);color:var(--accent)}
  td.inv{background:var(--ink)!important;color:var(--bg)}

  .cell .tools .invbtn{opacity:0;font-size:12px;cursor:pointer;padding:3px 6px;border-radius:6px;color:var(--muted);border:1px solid transparent}
  td:hover .invbtn,td:focus-within .invbtn{opacity:1}
  .cell .tools .invbtn:hover{border-color:var(--line)}

  .subtitle:focus{outline:2px solid var(--accent-soft);background:var(--panel);color:var(--ink)}
  .tsize{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .tsize button{border:none;border-radius:0;padding:4px 8px;font-size:12px}
  *{box-sizing:border-box}
  button,.chip,.jump,.chk,.dpad,.linknav,.zoom,nav.crumbs a{touch-action:manipulation}
  html,body{margin:0;background:var(--lbg,var(--bg));color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;transition:background .35s;touch-action:pan-x pan-y}

  .spacer{flex:1}
  button{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 11px;border-radius:7px;cursor:pointer}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button:disabled{opacity:.45;cursor:default}
  button.off{opacity:.6} button.off .lbl{text-decoration:line-through}
  button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

  #btnMore{display:none}
  @media(max-width:760px){ header button .lbl{display:none} button i{margin-right:0} .bar{gap:6px;padding:6px 10px} header h1{display:none} #stats{display:none}

    header .bar.projects.open{flex-wrap:wrap;overflow:visible}

    header .bar.projects.open .chip{max-width:none}
    #btnMore{display:inline-flex} }
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{opacity:.9;color:#fff}
  button.danger:hover{border-color:var(--warn);color:var(--warn)}
  .chip{font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
  .chip b{font-family:"JetBrains Mono",monospace;font-weight:500;opacity:.7;margin-right:5px}
  .chip.here{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip.here b{opacity:.85}
  .chip.add{color:var(--muted)}
  .chip.capture{border-style:dashed}
  .chip.personal{border-color:#c98a1b;box-shadow:inset 0 0 0 1px #c98a1b}
  .chip.personal.here{background:#8a5a0a;border-color:#8a5a0a;box-shadow:none}
  .chip.trash{color:var(--warn)}
  .divider{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:0 2px 0 8px}
  .chip:hover{border-color:var(--accent)}
  .dpad{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .dpad button{border:none;border-radius:0;padding:6px 11px;font-size:13px;min-width:40px}
  .dpad button+button{border-left:1px solid var(--line)}

  .zoom{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .zoom button{border:none;border-radius:0;padding:6px 9px}
  .zoom span{font-family:"JetBrains Mono",monospace;font-size:12px;min-width:46px;text-align:center;cursor:pointer}
  main{max-width:1240px;margin:0 auto;padding:18px 20px 60px;zoom:var(--zoom,1)}
  .pill{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);padding:3px 8px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
  .pill.ok{color:var(--accent);border-color:var(--accent)}
  .pill.warn{color:var(--warn);border-color:var(--warn)}
  .pill.track{color:var(--ink);font-weight:500;border-color:var(--lline,var(--line));background:var(--lhead,transparent);overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .pill.track b{font-weight:600}
  .pill.track .path{opacity:.7}
  nav.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:4px;font-size:13px;color:var(--muted);margin-bottom:10px}
  nav.crumbs a{color:var(--accent);text-decoration:none;padding:3px 7px;border-radius:6px;cursor:pointer}
  nav.crumbs a:hover{background:var(--accent-soft)}
  nav.crumbs .sep{opacity:.5}
  nav.crumbs .here{color:var(--ink);font-weight:600;padding:3px 7px}
  .titlebar{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .titlebar input{font:inherit;font-size:22px;font-weight:600;border:none;background:transparent;color:var(--ink);padding:4px 6px;border-radius:6px;min-width:200px;flex:1}
  .titlebar input:focus{outline:2px solid var(--accent-soft);background:var(--panel)}
  .linkedfrom{font-size:12.5px;color:var(--muted);margin:0 0 12px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .linkedfrom a{color:var(--ref);cursor:pointer;text-decoration:none;padding:2px 7px;border-radius:6px;border:1px dashed var(--ref)}
  .linkedfrom a.owner{color:var(--accent);border:1px solid var(--accent)}
  .linkedfrom a:hover{background:var(--panel)}
  .colnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 8px}
  .colnav .pill{flex:1;text-align:center;min-width:120px}
  body.phone th,body.phone td{min-width:0;max-width:none;word-break:normal;overflow-wrap:break-word;hyphens:auto}
  body.phone #grid{min-width:0;width:100%;table-layout:fixed}

  body.phone .cell textarea{padding:8px 6px 6px}

  body.phone .cell{min-height:44px}
  body.phone .cell textarea{padding-right:34px;padding-bottom:10px}
  #celltools{display:none;position:fixed;left:8px;right:8px;bottom:8px;z-index:12;align-items:center;gap:6px;padding:6px 8px;background:var(--panel);border:1px solid var(--accent);border-radius:10px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;box-shadow:var(--shadow)}
  body.phone main{padding-bottom:90px}
  body.phone header{position:static}
  body.phone .titlebar input{flex:1 1 100%;min-width:0;font-size:19px}
    #phonenav{display:none;position:sticky;top:0;z-index:11;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.08);align-items:center;justify-content:center;gap:8px}
  body.phone #phonenav{display:flex}
  #phonebar,#morepanel{display:none}
  @media(max-width:760px){
    #phonenav{display:flex!important;flex-wrap:nowrap;gap:6px;padding:6px}

  }
  #phonenav .dpad button{min-width:52px;padding:9px 0;font-size:16px}
  #phonenav .linknav button{padding:9px 10px;font-size:15px}
  #phonenav>button{padding:9px 10px;font-size:15px}
  body.phone #celltools.on{display:flex}
  #celltools .lbl{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--accent);font-weight:600;flex:0 0 auto;margin-right:2px}
  #celltools .tools{display:flex!important;flex-wrap:nowrap;gap:6px;padding:0;align-items:center}
  #celltools .tools .cbtn,#celltools .tools .ghost,#celltools .tools .invbtn,#celltools .tools .unlink,#celltools .tools .child{opacity:1;font-size:13px;padding:6px 10px;min-height:34px;display:inline-flex;align-items:center;white-space:nowrap;flex:0 0 auto;margin:0;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
  body.phone .jump{width:28px;height:28px;font-size:18px;bottom:4px;right:4px}
  body.phone .cell textarea{font-size:16px;padding:10px 8px 6px}
  body.phone .cell textarea{font-size:15px}
  #layout>*{min-width:0}
  .tablewrap{overflow:auto;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
  table{border-collapse:separate;border-spacing:0;width:100%;min-width:480px}
  th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;padding:0;min-width:150px}
  @media(max-width:760px){ table{min-width:0;table-layout:fixed} th,td{min-width:0} th.rowhead{width:32px} }
  th{background:var(--lhead,var(--bg));font-weight:500;font-size:12px;color:var(--muted);text-align:left;padding:6px 10px;white-space:nowrap}
  th.rowhead{width:36px;min-width:36px;text-align:center}
  th .colbtns,th .rowbtns{display:none;margin-left:6px}
  th:hover .colbtns,th:hover .rowbtns,th.show .colbtns,th.show .rowbtns{display:inline}
  th.show .rowbtns{display:block}
  th .colbtns button,th .rowbtns button{padding:0 5px;font-size:11px;border-radius:4px;margin-left:2px}
  tr:last-child td{border-bottom:none}
  td:last-child,th:last-child{border-right:none}
  td{position:relative}
  td.linked{background:var(--accent-soft)}
  td.isref{background:var(--ref-soft)}
  .cell{display:flex;flex-direction:column;min-height:52px}
  .jump{position:absolute;bottom:4px;right:4px;width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;color:#fff;background:var(--accent);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.2);z-index:1;user-select:none}
  .jump.ref{background:var(--ref)}

  td:hover .jump.empty,td:focus-within .jump.empty{opacity:1;border-color:var(--accent);color:var(--accent)}

  .overlay{position:fixed;inset:0;background:var(--bg);z-index:15;display:none;flex-direction:column}
  .overlay.open{display:flex}
  .overlay .bar{background:var(--panel);border-bottom:1px solid var(--line)}
  .overlayBody{flex:1;overflow:auto;padding:16px 20px 40px}
  .gsec{max-width:1000px;margin:0 auto 18px}
  .gsec h2{font-size:14px;margin:0 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  .gsec p.lead{margin:0 0 8px;font-size:13.5px;color:var(--muted)}
  .gtab{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
  .gtab th{background:var(--lhead,var(--bg));font-size:12px;color:var(--muted);text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
  .gtab td{padding:9px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;font-size:13.5px;line-height:1.4}
  .gtab td:last-child{border-right:none} .gtab tr:last-child td{border-bottom:none}
  .gtab td.ic{font-size:20px;text-align:center;width:64px;white-space:nowrap}
  .gtab td.ic small{display:block;font-size:10px;color:var(--muted);font-family:"JetBrains Mono",monospace}
  .gtab td b{font-weight:600}
  .gtab kbd{font-size:11px}
  @media(max-width:700px){ .gtab td{font-size:13px;padding:7px 8px} .gtab td.ic{font-size:18px;width:48px} }
  /* snapshot overlay */
  #snap{position:fixed;inset:0;background:var(--bg);z-index:15;display:none;flex-direction:column}
  #snap.open{display:flex}
  #snap .bar{background:var(--panel);border-bottom:1px solid var(--line)}
  #snapBody{flex:1;overflow:auto;padding:20px;touch-action:pan-x pan-y}
  #snapInner{zoom:var(--szoom,0.8);width:max-content;min-width:100%}
  .scard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 14px;box-shadow:var(--shadow);width:max-content;max-width:1100px}
  .scard .shead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  .scard .shead .pn{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
  .scard .shead h3{margin:0;font-size:15px}
  .scard .shead .from{font-size:11.5px;color:var(--muted)}
  .scard .ssub{font-size:12px;color:var(--muted);margin:0 0 8px;max-width:900px}
  .scard table{min-width:0;width:auto}
  .scard th,.scard td{min-width:90px;max-width:260px;font-size:12px;padding:5px 8px;vertical-align:top;white-space:pre-wrap;word-break:break-word}
  .scard td.linked{background:var(--accent-soft)} .scard td.isref{background:var(--ref-soft)}
  .scard td .lk{color:var(--accent);font-weight:600;cursor:pointer;white-space:nowrap} .scard td .lk.ref{color:var(--ref)}
  .skids{margin:8px 0 0 18px;padding-left:16px;border-left:2px solid var(--lline,var(--line))}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Nested Tables</h1>
    <span class="pill track" id="track"></span>
    <span class="pill" id="stats"></span>
    <span class="pill more" id="sync">local only</span>
    <div class="spacer"></div>
    <span class="dpad" title="Move through the tree: ▲ parent · ▼ into the selected cell's sub-table · ◀ ▶ neighbouring tables (Alt+arrows)">
      <button id="navL" title="Previous sibling table (Alt+←)">◀</button><button id="navU" title="Up to parent (Alt+↑)">▲</button><button id="navD" title="Down into sub-table (Alt+↓)">▼</button><button id="navR" title="Next sibling table (Alt+→)">▶</button>
    </span>
    <span class="linknav more" title="Hop between hyperlinked cells in this table (Alt+[ and Alt+]); then ▼ follows the selected one">
      <button id="linkPrev" title="Previous hyperlink (Alt+[)">↳◀</button><button id="linkNext" title="Next hyperlink (Alt+])">↳▶</button>
    </span>
    <button id="btnBack" title="Back to the previous table"><i>↩</i><span class="lbl">Back</span></button>
    <button id="btnProjList" title="Drop the projects down as a list / back to one line"><i>⌄</i><span class="lbl">Projects</span></button>
    <button id="btnCapture" title="Capture: paste text (Keep note, Live Text from a photo) → a 📷 capture project"><i>📋</i><span class="lbl">Capture</span></button>
    <button class="more" id="btnLock" title="Password-protect this project (encrypted on this device and in every backup), or lock it now"><i>🔒</i><span class="lbl">Lock</span></button>
    <button id="btnSearch" title="Search every project for a word or words (Ctrl/⌘ K)"><i>🔍</i><span class="lbl">Search</span></button>
    <button id="btnTodo" title="Quick to-do: one line → a row in this project's To do table"><i>✓</i><span class="lbl">To-do</span></button>
    <button id="btnMore" title="More tools"><i>⋯</i></button>
    <button class="more" id="btnTree" title="Outline of this project"><i>☰</i><span class="lbl">Outline</span></button>
    <button class="more" id="btnSnap" title="Snapshot: the whole project on one page, zoom and pan"><i>🗺</i><span class="lbl">Snapshot</span></button>
    <button class="more" id="btnGuide" title="Guide: every icon and concept, one per cell"><i>❓</i><span class="lbl">Guide</span></button>
    <span class="zoom more" title="Zoom (Ctrl/⌘ + − 0, Ctrl+scroll, pinch)"><button id="zoomOut" title="Zoom out">−</button><span id="zoomPct" title="Reset zoom">100%</span><button id="zoomIn" title="Zoom in">+</button></span>
    <button class="more" id="btnColors" title="Layer colors: tint each nesting layer"><i>🎨</i><span class="lbl">Colors</span></button>
    <button class="more" id="btnNight" title="Night mode"><i>☾</i><span class="lbl">Night</span></button>
    <button class="more" id="btnPhone" title="Phone mode: a few columns at a time"><i>📱</i><span class="lbl">Phone</span></button>
    <button class="more" id="btnSave" title="Save, export and back up"><i>💾</i><span class="lbl">Save</span></button>
    <button class="more" id="btnImport" title="Import a JSON backup"><i>📥</i><span class="lbl">Import</span></button>
    <button class="more" id="btnReset" class="danger" title="Clear everything"><i>🗑</i><span class="lbl">Reset</span></button>
  </div>
  <div class="bar projects" id="projbar"></div>
</header>

<div id="phonenav"></div>
<div id="morepanel"></div>
<div id="phonebar"><button id="pbNew" title="New project"><i>＋</i><span class="lbl">New</span></button></div>
<main>
  <nav class="crumbs" id="crumbs"></nav>
  <div class="layout" id="layout">
    <aside class="tree" id="tree"></aside>
    <section>
      <div class="titlebar">
        <input id="tname" placeholder="Table title" spellcheck="false">
        <span class="tsize" title="Title and subtitle size"><button id="tsMinus">A−</button><button id="tsPlus">A+</button></span>
        <span class="pill" id="depth"></span>
        <button id="btnUp" title="Up to the parent table"><i>⬆</i><span class="lbl">Up</span></button>
        <button id="btnVer" title="Save a numbered, dated version of this project"><i>🕒</i><span class="lbl">Version</span></button>
        <button id="btnDelete" class="danger" title="Delete this table and everything beneath it"><i>🗑</i><span class="lbl">Delete table</span></button>
      </div>
      <textarea id="tsub" class="subtitle" rows="1" placeholder="Subtitle or notes for this layer…" spellcheck="false"></textarea>
      <div class="linkedfrom" id="linkedfrom"></div>
      <div class="colnav" id="colnav" style="display:none">
        <span class="dpad"><button id="cn3L" title="Back 3 columns">◀3</button><button id="cn2L" title="Back 2 columns (keeps one in view)">◀2</button></span>
        <span class="pill" id="cnLabel"></span>

        <span class="dpad" title="Columns shown at once"><button id="cnMinus">−</button><button id="cnN" disabled style="opacity:1;font-family:'JetBrains Mono',monospace"></button><button id="cnPlus">+</button></span>
      </div>

    </section>

</main>

<div id="guide" class="overlay">
  <div class="bar"><h1 style="font-size:15px;margin:0;font-weight:600">Guide</h1><span class="pill">one concept per cell</span><div class="spacer"></div><button id="guideClose" class="primary">Close</button></div>
  <div class="overlayBody" id="guideBody"></div>
</div>
<div id="snap">
  <div class="bar">
    <h1 id="snapTitle" style="font-size:15px;margin:0;font-weight:600"></h1>
    <span class="pill" id="snapStats"></span>
    <div class="spacer"></div>
    <span class="zoom"><button id="szOut" title="Zoom out">−</button><span id="szPct" title="Reset">80%</span><button id="szIn" title="Zoom in">+</button></span>
    <button id="snapPdf">Download PDF</button>
    <button id="snapMd">Obsidian bundle (.zip)</button>
    <button id="snapClose" class="primary">Close</button>
  </div>
  <div id="snapBody"><div id="snapInner"></div></div>
</div>
<div class="modal" id="modal">
  <div class="box">
    <h3 id="mTitle"></h3>
    <p id="mText"></p>
    <input class="search" id="mSearch" placeholder="Search tables…" style="display:none">
    <div class="list" id="mList" style="display:none"></div>
    <div id="mExtra" style="display:none"></div>
    <textarea id="mArea" spellcheck="false"></textarea>
    <div class="row" id="mBtns"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const KEY = 'nested-tables-v3'; const APP_VERSION='1.24';
  const uid = () => Math.random().toString(36).slice(2,10);
  const now = () => Date.now();
  const cell = (t='') => ({t, link:null, ref:false});
  const $ = id => document.getElementById(id);

  // ---------- state ----------
  // S = { projects:{pid:{id,n,name,root,u}}, tables:{tid:{id,p,n,name,parent,cols,rows,u}}, cur:pid, curTable:{pid:tid}, fresh }
  let S, hist=[];
  const dirty=new Set(), deleted=new Set(), purged=new Set(); let metaDirty=false;
  function touch(t){ t.u=now(); S.fresh=false; dirty.add(t.id); const p=S.projects[t.p]; if(p&&p.enc) encDirty.add(p.id); }
  function touchMeta(){ S.fresh=false; metaDirty=true; }

  function P(){ return S.projects[S.cur]; }
  const live=()=>Object.values(S.projects).filter(p=>!p.trashed).sort((a,b)=>a.n-b.n);
  const trashed=()=>Object.values(S.projects).filter(p=>p.trashed).sort((a,b)=>b.trashed-a.trashed);
  function T(){ return S.tables[S.curTable[S.cur]]; }
  function tablesOf(pid){ return Object.values(S.tables).filter(t=>t.p===pid&&!t.trashed); }
  function trashedBatches(){ const b={}; Object.values(S.tables).forEach(t=>{ if(t.trashed){ (b[t.trashBatch]=b[t.trashBatch]||[]).push(t); } }); return Object.values(b).sort((x,y)=>y[0].trashed-x[0].trashed); }
  function nextPageNo(pid){ let m=0; tablesOf(pid).forEach(t=>{ if(t.n>m) m=t.n; }); return m+1; }
  function nextProjNo(){ let m=0; Object.values(S.projects).forEach(p=>{ if(p.n>m) m=p.n; }); return m+1; }
  function newTable(pid, name, parent){
    return {id:uid(), p:pid, n:nextPageNo(pid), name, parent:parent||null, cols:['A','B','C'], rows:[[cell(),cell(),cell()],[cell(),cell(),cell()]], u:now()};
  }
  function newProject(name){
    const p={id:uid(), n:nextProjNo(), name:name||('Project '+nextProjNo()), root:null, u:now()};
    S.projects[p.id]=p;
    const root=newTable(p.id,'Home',null); S.tables[root.id]=root; p.root=root.id; S.curTable[p.id]=root.id;
    dirty.add(root.id); touchMeta();
    return p;
  }
  const DEFAULT_TEXTS=new Set(['Click a cell to type','Type .. for a sub-table','Each sub-table can nest again','→ link points at any existing table','']);
  function isDefaultProject(p){ if(p.enc) return false; const ts=tablesOf(p.id); if(ts.length!==1) return false; const t=ts[0]; if(t.sub&&t.sub.trim()) return false; return t.rows.every(r=>r.every(c=>!c.link&&DEFAULT_TEXTS.has(c.t.trim()))); }
  function pruneDefaults(){ // remove untouched default projects when there is more than one project (each device creates one before the cloud answers)
    let all=live(); if(all.length<2) return false;
    let ghosts=false; const byRoot={}; all.forEach(p=>{ (byRoot[p.root]=byRoot[p.root]||[]).push(p); });
    Object.values(byRoot).forEach(list=>{ if(list.length<2) return; const rt=S.tables[list[0].root]; const keep=list.find(p=>rt&&rt.p===p.id)||list.slice().sort((a,b)=>(b.u||0)-(a.u||0))[0]; list.forEach(p=>{ if(p.id!==keep.id){ tablesOf(p.id).forEach(t=>{ t.p=keep.id; touch(t); }); purged.add(p.id); delete S.projects[p.id]; delete S.curTable[p.id]; ghosts=true; } }); });
    if(ghosts){ if(!S.projects[S.cur]) S.cur=live()[0].id; touchMeta(); all=live(); if(all.length<2) return true; }
    const names={}; all.forEach(p=>{ const k=(p.name||'').trim().toLowerCase(); (names[k]=names[k]||[]).push(p); });
    const defaults=all.filter(p=>isDefaultProject(p)&&names[(p.name||'').trim().toLowerCase()].length>1); if(!defaults.length) return ghosts;
    let ch=false;
    defaults.slice().reverse().forEach(p=>{ const k=(p.name||'').trim().toLowerCase(); if(names[k].length<2) return; names[k]=names[k].filter(x=>x.id!==p.id); tablesOf(p.id).forEach(t=>{ delete S.tables[t.id]; dirty.delete(t.id); deleted.add(t.id); }); purged.add(p.id); delete S.projects[p.id]; delete S.curTable[p.id]; ch=true; });
    if(ch){ if(!S.projects[S.cur]) S.cur=live()[0].id; touchMeta(); }
    return ch;
  }
  function freshState(){
    S={projects:{}, tables:{}, cur:null, curTable:{}, fresh:true};
    const p=newProject('Project 1'); S.cur=p.id;
    const r=S.tables[p.root];
    r.rows[0][0].t='Click a cell to type'; r.rows[0][1].t='Type .. for a sub-table'; r.rows[1][0].t='Each sub-table can nest again'; r.rows[1][1].t='→ link points at any existing table';
    dirty.clear(); metaDirty=false; S.fresh=true;
  }
  function migrateV2(){
    try{ const raw=localStorage.getItem('nested-tables-v2'); if(!raw) return false; const o=JSON.parse(raw); if(!o.tables||!o.tables[o.root]) return false;
      S={projects:{}, tables:{}, cur:null, curTable:{}, fresh:false};
      const p={id:uid(), n:1, name:'Project 1', root:o.root, u:now()}; S.projects[p.id]=p; S.cur=p.id;
      Object.values(o.tables).forEach(t=>{ t.p=p.id; S.tables[t.id]=t; dirty.add(t.id); });
      S.curTable[p.id]=o.tables[o.current]?o.current:o.root; touchMeta(); return true;
    }catch(e){ return false; }
  }
  function load(){
    try{ const raw=localStorage.getItem(KEY); if(raw){ S=JSON.parse(raw); if(S.projects&&S.tables&&S.projects[S.cur]) { ensureSane(); mergeSeed(); return; } } }catch(e){}
    if(window.__seed&&window.__seed.projects){ S=JSON.parse(JSON.stringify(window.__seed)); Object.values(S.projects).forEach(p=>{ p.importedAt=now(); }); S.fresh=false; ensureSane(); return; }
    if(migrateV2()) return;
    freshState();
  }
  function mergeSeed(){ const sd=window.__seed; if(!sd||!sd.projects) return; let added=0, updated=0, copies=0;
    const byName={}; Object.values(S.projects).filter(p=>!p.trashed).forEach(p=>byName[(p.name||'').trim().toLowerCase()]=p);
    const copyIn=(sp,name)=>{ const np=JSON.parse(JSON.stringify(sp)); if(S.projects[np.id]) np.id=uid(); np.name=name||np.name; np.n=nextProjNo(); np.u=now(); np.importedAt=now(); const map={}; const src=Object.values(sd.tables).filter(t=>t.p===sp.id); src.forEach(t=>map[t.id]=S.tables[t.id]?uid():t.id); src.forEach(t=>{ const c=JSON.parse(JSON.stringify(t)); c.id=map[t.id]; c.p=np.id; if(c.parent&&map[c.parent.tableId]) c.parent.tableId=map[c.parent.tableId]; c.rows.forEach(r=>r.forEach(x=>{ if(x.link&&map[x.link]) x.link=map[x.link]; })); S.tables[c.id]=c; dirty.add(c.id); }); np.root=map[sp.root]||sp.root; S.projects[np.id]=np; S.curTable[np.id]=np.root; return np; };
    Object.values(sd.projects).forEach(sp=>{ const key=(sp.name||'').trim().toLowerCase(); const lp=byName[key]||S.projects[sp.id];
      if(!lp){ copyIn(sp); added++; return; }
      if(!sp.srev||lp.srev===sp.srev||lp.enc) return; // same build, or nothing to compare
      const touched=tablesOf(lp.id).some(t=>(t.u||0)>(lp.importedAt||0)+5000);
      if(!touched){ saveVersion(lp,'before update from build '+APP_VERSION,{auto:true}); removeTables(tablesOf(lp.id).map(t=>t.id)); const np=copyIn(sp,lp.name); np.n=lp.n; np.id===lp.id||(delete S.projects[lp.id], delete S.curTable[lp.id]); if(S.cur===lp.id) S.cur=np.id; updated++; }
      else { copyIn(sp,sp.name+' · update '+new Date().toLocaleDateString(undefined,{month:'short',day:'numeric'})); copies++; } });
    if(added||updated||copies){ touchMeta(); try{ localStorage.setItem(KEY, JSON.stringify(persistable())); }catch(e){} setTimeout(()=>toast([added&&added+' new',updated&&updated+' updated',copies&&copies+' arrived as a dated copy (yours was edited)'].filter(Boolean).join(' · ')+' from this build'),600); } }
  function ensureSane(){
    if(!S.curTable) S.curTable={};
    if(!Object.keys(S.projects).length) newProject('Project 1');
    Object.values(S.projects).forEach(p=>{ if(p.trashed&&now()-p.trashed>30*86400000) purgeProject(p); });
    trashedBatches().forEach(b=>{ if(now()-b[0].trashed>30*86400000) purgeBatch(b[0].trashBatch); });
    if(!live().length){ const t=trashed()[0]; if(t){ delete t.trashed; touchMeta(); } else newProject('Project 1'); }
    if(!S.projects[S.cur]||S.projects[S.cur].trashed) S.cur=live()[0].id;
    if(isLocked(S.projects[S.cur])){ const o=live().find(x=>!isLocked(x)); if(o) S.cur=o.id; }
    Object.values(S.projects).forEach(p=>{ if(isLocked(p)) return; if(!S.tables[p.root]){ const r=tablesOf(p.id).find(t=>!t.parent)||tablesOf(p.id)[0]; if(r) p.root=r.id; else { const nr=newTable(p.id,'Home',null); S.tables[nr.id]=nr; p.root=nr.id; dirty.add(nr.id); } touchMeta(); } if(!S.tables[S.curTable[p.id]]||S.tables[S.curTable[p.id]].p!==p.id) S.curTable[p.id]=p.root; });
    Object.values(S.tables).forEach(t=>{ if(!S.projects[t.p]) { t.p=S.cur; touch(t); } });
  }
  let saveTimer;
  function save(){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(async()=>{
      for(const pid of [...encDirty]){ const p=S.projects[pid]; if(p&&p.enc&&vault[pid]){ try{ await encryptTables(p); }catch(e){ console.warn('encrypt',e); } } }
      try{ localStorage.setItem(KEY, JSON.stringify(persistable())); if(window.__standalone) setSync('v'+APP_VERSION+' · saved '+new Date().toTimeString().slice(0,5)+' · '+live().length+' projects'); }catch(e){ toast('Could not save: browser storage is full or blocked'); setSync('v'+APP_VERSION+' · NOT SAVED','warn'); }
      scheduleFlush(); scheduleAuto();
    },150);
  }
  function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }

  function pathOf(id){ const p=[]; let t=S.tables[id]; const seen=new Set(); while(t && !seen.has(t.id)){ seen.add(t.id); p.unshift(t); t=t.parent? S.tables[t.parent.tableId] : null; } return p; }
  function isOwnerCell(t,ri,ci){ const c=t.rows[ri][ci]; const k=c.link&&S.tables[c.link]; return !!(k && !c.ref && k.parent && k.parent.tableId===t.id); }
  function ownedChildren(id){ const t=S.tables[id]; const out=[]; if(!t) return out; t.rows.forEach((r,ri)=>r.forEach((c,ci)=>{ if(isOwnerCell(t,ri,ci)) out.push({id:c.link,ri,ci}); })); return out; }
  function descendants(id, seen=new Set()){ const out=[]; ownedChildren(id).forEach(k=>{ if(seen.has(k.id)) return; seen.add(k.id); out.push(k.id); out.push(...descendants(k.id,seen)); }); return out; }
  function incoming(id){ const out=[]; Object.values(S.tables).forEach(t=>!t.trashed&&t.rows.forEach((r,ri)=>r.forEach((c,ci)=>{ if(c.link===id) out.push({t,ri,ci,owner:isOwnerCell(t,ri,ci)}); }))); return out; }
  function go(id, push=true){ const t=S.tables[id]; if(!t) return; if(t.p!==S.cur){ S.cur=t.p; hist=[]; } else if(push && id!==S.curTable[S.cur]) hist.push(S.curTable[S.cur]); S.curTable[S.cur]=id; try{ localStorage.setItem(KEY, JSON.stringify(persistable())); }catch(e){} render(); }
  function goProject(pid){ if(window.innerWidth<=760&&$('projbar').classList.contains('open')) toggleProjectList(false); if(!S.projects[pid]||pid===S.cur) return; if(isLocked(S.projects[pid])) return promptUnlock(S.projects[pid],()=>goProject(pid)); S.cur=pid; hist=[]; if(!S.tables[S.curTable[pid]]) S.curTable[pid]=S.projects[pid].root; try{ localStorage.setItem(KEY, JSON.stringify(persistable())); }catch(e){} render(); }

  // ---------- rendering ----------
  function render(){
    ensureSane();
    if(isLocked(P())){ // every project is locked: show the unlock screen instead of a grid
      renderProjects(); $('layout').style.display='none'; $('track').textContent='Project '+P().n+' · locked'; $('stats').textContent='';
      let L=$('lockedMsg'); if(!L){ L=document.createElement('div'); L.id='lockedMsg'; L.style.cssText='text-align:center;padding:60px 20px;color:var(--muted)'; document.querySelector('main').appendChild(L); }

  function buildFromSpec(pid, spec, parent){
    const t=newTable(pid, spec.name, parent); t.sub=spec.sub||''; t.cols=spec.cols.slice(); t.rows=[];
    S.tables[t.id]=t; if(spec.key) buildFromSpec.keys[spec.key]=t.id;
    spec.rows.forEach((row,ri)=>{ const r=[]; row.forEach((cs,ci)=>{ const c=cell(typeof cs==='string'?cs:(cs.t||'')); if(cs&&typeof cs==='object'&&cs.chk!==undefined) c.chk=cs.chk; r.push(c);
      if(cs&&cs.child){ const k=buildFromSpec(pid, cs.child, {tableId:t.id,r:ri,c:ci}); c.link=k.id; c.ref=false; }
      if(cs&&cs.link) buildFromSpec.pending.push({c, key:cs.link});
    }); t.rows.push(r); });
    dirty.add(t.id); return t;
  }
  function loadSample(spec){
    if(!spec||!spec.rows){ toast('This build does not include that sample yet — reload the app and try again'); return; }
    const existing=live().find(p=>(p.name||'').trim().toLowerCase()===spec.name.trim().toLowerCase());
    if(existing&&tablesOf(existing.id).length>1){ goProject(existing.id); toast('"'+spec.name+'" is already here — opened it'); return; }
    if(existing){ purgeProject(existing); } // an empty shell with the same name: replace it
    const p={id:uid(), n:nextProjNo(), name:spec.name, root:null, u:now()};
    try{
      S.projects[p.id]=p; buildFromSpec.keys={}; buildFromSpec.pending=[];
      const root=buildFromSpec(p.id, spec, null); p.root=root.id;
      buildFromSpec.pending.forEach(x=>{ const id=buildFromSpec.keys[x.key]; if(id){ x.c.link=id; x.c.ref=true; } });
    }catch(e){ console.warn('sample',e); tablesOf(p.id).forEach(t=>{ delete S.tables[t.id]; dirty.delete(t.id); }); delete S.projects[p.id]; toast('Sample failed to load: '+(e.message||e)); render(); return; }
    S.cur=p.id; S.curTable[p.id]=root_id_of(p); hist=[]; touchMeta(); save(); render(); toast('Added "'+spec.name+'" — '+tablesOf(p.id).length+' tables');
  }

],['IBD','Flares, steroid courses, resections','Fecal calprotectin if active','Steroids plus inflammation plus malabsorption'],['Chronic liver disease / PBC','Pruritus, jaundice, alcohol','LFTs, AMA','Cholestasis impairs vitamin D handling'],['Chronic pancreatitis / CF','Steatorrhea','Fecal elastase','Fat-soluble vitamin malabsorption']]

          [{t:'Hematologic / oncologic',child:{

ith raised ferritin → genotype"],["2","HFE genotype (C282Y, H63D)","Hereditary hemochromatosis"],["3","Liver enzymes; MRI liver iron if ferritin > 1,000","Fibrosis risk"],["4","Testosterone/LH (men), menstrual history (women)","Pituitary iron → hypogonadism"],["5","Treat","Phlebotomy or chelation; treat hypogonadism; bone agent by risk"]]}},'Transfusions, iron overload','Ferritin, transferrin saturation'],['Cancer treatment','Aromatase inhibitors, ADT, chemotherapy-induced menopause','See Medications']]

          [{t:'Secondary-cause lab screen (gate)',child:{
            name:'Secondary-cause lab screen', sub:'The gate before any bone drug: tick each as resulted. Each test → links (purple) to the differential it screens for, and that row ↳ opens the confirmatory workup. Tier 1 for everyone; tier 2 by trigger.',
            cols:['Test','Tier','What it catches','Acts on'],
            rows:[[{t:"Calcium (albumin-corrected) and phosphate",chk:false,link:"oswphpt"},'1','Hyperparathyroidism, malignancy, osteomalacia','PTH if Ca high or high-normal'],[{t:"Alkaline phosphatase",chk:false,link:"oswvitd"},'1','Osteomalacia, Paget, liver disease','Bone-specific ALP, GGT if raised'],[{t:'Creatinine / eGFR',chk:false},'1','CKD-MBD; agent choice (no bisphosphonate below eGFR 30–35)','Nephrology if <30'],[{t:"25-OH vitamin D",chk:false,link:"oswvitd"},'1','Deficiency; must replete before denosumab/zoledronate','Replete to ≥30 ng/mL'],[{t:"TSH",chk:false,link:"oswthy"},'1','Hyperthyroidism, over-replacement','Normalize before judging BMD loss'],[{t:"CBC",chk:false,link:"oswmm"},'1','Anemia (myeloma, celiac), marrow disease','SPEP/FLC if unexplained anemia'],[{t:"PTH",chk:false,link:"oswphpt"},'1','Primary hyperparathyroidism; secondary to vitamin D deficiency or CKD','24-h urine Ca, eGFR, DXA radius'],[{t:"24-h urine calcium (and creatinine)",chk:false,link:"oswhcu"},'2','Hypercalciuria; malabsorption (low); FHH (low with high Ca)','Thiazide; celiac serology'],[{t:"SPEP + serum free light chains",chk:false,link:"oswmm"},'2','Multiple myeloma (vertebral fracture + anemia/ESR/Ca)','Hematology'],[{t:"Celiac serology (tTG-IgA + total IgA)",chk:false,link:"oswcel"},'2','Celiac disease; low BMD with GI or iron clues','GI; gluten-free diet'],[{t:"Testosterone (men), estradiol/FSH (women <45)",chk:false,link:"oswhypo"},'2','Hypogonadism','Endocrine evaluation'],[{t:"Late-night salivary cortisol or 1 mg DST",chk:false,link:"oswcush"},'2','Cushing syndrome (cushingoid features, unexplained loss)','Endocrine'],[{t:"Tryptase",chk:false,link:"oswmast"},'2','Systemic mastocytosis (flushing, anaphylaxis)','Hematology'],[{t:"Ferritin / transferrin saturation",chk:false,link:"oswiron"},'2','Hemochromatosis','GI/hematology'],[{t:'Bone turnover markers (CTX, P1NP)',chk:false,child:{name:'Bone turnover markers (BTM)', sub:'Prompt: are we measuring to decide, or to feel better? BTMs monitor response and adherence; they do not diagnose osteoporosis or replace DXA. Reference markers: serum β-CTX (resorption) and P1NP (formation).', cols:['Question','Answer','Pitfall / nuance'], rows:[
['Which markers?','Serum β-CTX (resorption) and intact/total P1NP (formation). These are the IOF/IFCC reference markers; others (NTX, osteocalcin, bone ALP, TRACP5b) are second line.','Use one lab and one assay for serial values; automated CTX assays differ by platform.'],
['When to draw (pre-analytics)','CTX: fasting, morning (07–10h), same time each visit; food lowers CTX ~20% and there is a circadian nadir in the afternoon. P1NP is not meaningfully affected by food or time of day.','CTX accumulates in CKD (eGFR <30) and is raised for 6–12 months after any fracture. P1NP is falsely low on glucocorticoids and rises after fracture too.'],
[{t:'Baseline: before starting any drug',chk:false},'Draw CTX + P1NP at the pre-treatment visit, with the secondary-cause screen. Very high values prompt a second look at secondary causes (hyperparathyroidism, thyroid excess, Paget, metastases, osteomalacia) before treating.','A single baseline is not a fracture predictor for the individual; the association with fracture risk is modest and population-level.'],
[{t:'Antiresorptive response check (3–6 months)',chk:false},'Repeat CTX (and P1NP) 3 months after oral bisphosphonate, 3–6 months after IV or denosumab. Expected: CTX falls ≥ the least significant change (~30%, assay-dependent) or into the lower half of the premenopausal reference range; P1NP falls ≥ ~20–25%.','A fall below LSC = non-response gate → check adherence, dosing technique (fasting, water, upright 30 min), absorption (celiac, bariatric, PPI), and hidden secondary causes before switching agents (TRIO study).'],
[{t:'Anabolic response check (teriparatide/abaloparatide; romosozumab)',chk:false},'P1NP at 1–3 months: rise > 10 µg/L (teriparatide) above baseline confirms biological response; romosozumab gives an early P1NP rise and CTX fall.','Patients already on a bisphosphonate blunt the rise; interpret against their own baseline, not the reference range.'],
[{t:'Drug holiday monitoring (bisphosphonates)',chk:false},'CTX every 1–2 years off drug. Rising back above the premenopausal median (or above the patient\'s own pre-treatment value) is a trigger to re-assess with DXA and consider restarting.','Evidence for marker-guided restart is observational; combine with DXA change and new fractures rather than CTX alone.'],
[{t:'Denosumab discontinuation / transition',chk:false},'CTX rebounds above baseline within 3–6 months of a missed dose. Use CTX at ~6 months after the last dose to time and judge the follow-on bisphosphonate (zoledronate when CTX rises; repeat if still high).','Stopping denosumab without a bisphosphonate risks rebound vertebral fractures; CTX is the practical marker for this transition logic.'],
['What BTMs are not for','Diagnosis of osteoporosis; selecting a first agent; replacing DXA; deciding treatment in CKD stage 4–5 or shortly after fracture.','Report the specific marker, assay and sampling conditions in the note so later values are comparable.'],
['Interpretation gate','☐ Baseline drawn fasting a.m. before drug → ☐ 3–6 month value drawn same conditions → ☐ change ≥ LSC? Yes: continue, next DXA at 1–2 y. No: adherence/absorption/secondary-cause review before any switch.','Checkboxes are the logic gate; each clear answer closes a branch.'],
[{t:'References (key papers and guidelines)',child:{name:'BTM references', sub:'Primary sources behind the BTM logic. DOIs are stable identifiers; verify before citing in a document.', cols:['Reference','What it establishes','Link'], rows:[["Vasikaran S et al. IOF–IFCC position. Osteoporos Int 2011;22:391–420","CTX and P1NP named as the reference markers for clinical studies; standardization agenda.","https://doi.org/10.1007/s00198-010-1501-1"],["Eastell R, Szulc P. Use of bone turnover markers in postmenopausal osteoporosis. Lancet Diabetes Endocrinol 2017;5:908–923","Practical review: pre-analytics, expected changes on each drug class, LSC, limitations for diagnosis.","https://doi.org/10.1016/S2213-8587(17)30184-5"],["Diez-Perez A et al. IOF–ECTS working group: treatment failure in osteoporosis. Osteoporos Int 2012;23:2769–2774","Defines inadequate response: fracture plus BTM failure to change by LSC or BMD loss; basis for the non-response gate.","https://doi.org/10.1007/s00198-012-2093-8"],["Naylor KE et al. TRIO study. J Bone Miner Res 2016;31:1442–1451","Head-to-head alendronate/ibandronate/risedronate: CTX and P1NP changes, response thresholds and non-responders.","https://doi.org/10.1002/jbmr.2809"],["Eastell R et al. Endocrine Society clinical practice guideline, pharmacological management of osteoporosis in postmenopausal women. J Clin Endocrinol Metab 2019;104:1595–1622 (update 2020)","Suggests BTMs (CTX or P1NP) for monitoring response and adherence; drug-holiday and denosumab-transition guidance.","https://doi.org/10.1210/jc.2019-00221"],["Tsourdi E et al. ECTS position: discontinuation of denosumab. Bone 2017;105:11–17; update JCEM 2021","Rebound turnover and vertebral fractures after stopping denosumab; CTX-guided bisphosphonate follow-on.","https://doi.org/10.1016/j.bone.2017.08.003"],["Szulc P et al. NBHA BTM project: pre-analytical and analytical variability. Osteoporos Int 2017;28:2541–2556","Fasting, time of day, fracture, renal function and other sources of variability; LSC estimates.","https://doi.org/10.1007/s00198-017-4082-4"],["Diez-Perez A et al. Bone turnover markers for monitoring: IOF–IFCC / ECTS joint review. Osteoporos Int 2017;28:767–774","Framework for using BTMs to identify poor adherence and poor response in routine care.","https://doi.org/10.1007/s00198-017-3906-6"]]}},'Open for the literature list with DOIs.','Add your own in the reference table; cross-link from any cell with ↳.']]}},'2','Baseline for monitoring response/adherence, not diagnosis','Repeat at 3–6 months on therapy'],[{t:'Gate result: all tier-1 resulted and reviewed?',chk:false},'Gate','Nothing above changes the agent or the diagnosis','Proceed to treatment selection']]
          }},'Tick each test as it results','The gate before treatment: nothing starts until tier 1 is back','Lab panel; tier 2 by trigger']
        ]
      }},'Is something else driving bone loss?','One-third of women and half of men have a contributor; many are treatable','Targeted labs'],
      [{t:'4. Medications',child:{

      [{t:'8. Prior treatment',child:{

          [{t:'Bisphosphonates',child:{
            name:'Bisphosphonate history', sub:'Oral absorption is poor and adherence worse; "failed alendronate" often means never absorbed or never taken.',

            rows:[['Which drug, dose, route (alendronate, risedronate, ibandronate, zoledronate)','Potency and dosing differ','Record total years'],['Taken fasting with water, upright 30–60 min?','Absorption <1% and lost with food/coffee','Re-teach or switch to IV'],['Adherence (doses missed/month)','Persistence at 1 year is ~50%','Consider IV zoledronate'],['Duration: ≥5 yrs oral or ≥3 yrs IV?','Drug holiday consideration in lower-risk patients','Reassess risk; holiday only if not high risk'],['Atypical femoral fracture symptoms: thigh/groin ache','AFF risk rises with duration (>5 yrs)','Bilateral femur radiographs'],['Dental history: extractions, ONJ','ONJ rare (1 in 10,000–100,000)','Dental review before IV if major work pending'],['GI intolerance / esophageal disease','Contraindication to oral','IV route']]
          }},'Which, how taken, how long, side effects','Holiday possible after 5 (oral) / 3 (IV) years only if not high risk','Holiday vs continue vs switch'],
          [{t:'Denosumab',child:{

  // ---------- password protection (AES-GCM, PBKDF2) ----------
  const vault={}; // pid -> CryptoKey, memory only
  const encDirty=new Set();
  function isLocked(p){ return !!(p&&p.enc&&!vault[p.id]); }
  const b64=u8=>btoa(String.fromCharCode(...u8)); const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  async function deriveKey(pw,salt){ const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']); return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']); }

  const cellTa=(r,c)=>document.querySelector('#grid td[data-ri="'+r+'"][data-ci="'+c+'"] textarea');

  function renderTree(){
    const el=$('tree'); el.innerHTML='<h2>Outline · Project '+P().n+'</h2>';
    const seen=new Set(); const cur=T().id;
    function build(id, via){
      const t=S.tables[id]; const li=document.createElement('li'); const a=document.createElement('a'); a.textContent='P'+t.n+' · '+(t.name||'Untitled');

      const kids=document.createElement('ul');

    const ul=document.createElement('ul'); seen.add(P().root); ul.appendChild(build(P().root));

  function renderStats(){

    ts.forEach(t=>t.rows.forEach((r,ri)=>r.forEach((c,ci)=>{cells++; if(c.t.trim()) filled++; if(c.link&&S.tables[c.link]&&!isOwnerCell(t,ri,ci)) refs++;})));

    let boxes=0, done=0; ts.forEach(t=>t.rows.forEach(r=>r.forEach(c=>{ if(c.chk!==undefined&&c.chk!==null){ boxes++; if(c.chk) done++; } })));

  // ---------- mutations ----------
  function openChild(ri,ci,embed){
    const t=T(); const c=t.rows[ri][ci];
    if(c.link && S.tables[c.link]){ if(embed){ c.embed=!c.embed; touch(t); save(); render(); return; } return go(c.link); }
    const name=c.t.trim()?c.t.trim().split('\n')[0].slice(0,60):(t.name+' › '+cellRef(t,ri,ci));
    const rows=3, cols=3;
    const child=newTable(t.p,name,{tableId:t.id,r:ri,c:ci});
    child.cols=[]; for(let i=0;i<cols;i++) child.cols.push(nextColName(child));
    child.rows=[]; for(let i=0;i<rows;i++) child.rows.push(child.cols.map(()=>cell()));
    S.tables[child.id]=child; touch(child); c.link=child.id; c.ref=false; if(embed) c.embed=true; touch(t); save();
    if(embed){ render(); lastCell={ri,ci,table:t.id}; const ta2=cellTa(ri,ci); if(ta2) ta2.focus({preventScroll:true}); toast('Table embedded in the cell — ↳ or ▼ opens it'); } else go(child.id);
  }
  function stepper(label,val,min,max,onChange){
    const w=document.createElement('div'); w.className='stepper';
    const l=document.createElement('span'); l.className='lbl'; l.textContent=label;
    const m=document.createElement('button'); m.textContent='−'; m.type='button'; m.title='Fewer '+label.toLowerCase(); m.setAttribute('aria-label','Fewer '+label.toLowerCase());
    const n=document.createElement('span'); n.className='num'; n.textContent=val;
    const p=document.createElement('button'); p.textContent='+'; p.type='button'; p.title='More '+label.toLowerCase(); p.setAttribute('aria-label','More '+label.toLowerCase());
    const set=v=>{ v=Math.max(min,Math.min(max,v)); n.textContent=v; m.disabled=v<=min; p.disabled=v>=max; onChange(v); };
    m.onclick=()=>set(+n.textContent-1); p.onclick=()=>set(+n.textContent+1);
    w.append(l,m,n,p); set(val); return w;
  }

  function pickLink(ri,ci){
    const t=T();
    const items=tablesOf(S.cur).filter(x=>x.id!==t.id).sort((a,b)=>a.n-b.n).map(x=>({id:x.id,name:'P'+x.n+' · '+(x.name||'Untitled'),path:pathOf(x.id).map(p=>p.name||'Untitled').join(' › ')}));
    listModal('Link this cell to…','Pick any existing table in this project. The cell becomes a reference (purple); the table keeps its own place in the tree.',items,(id)=>{
      t.rows[ri][ci].link=id; t.rows[ri][ci].ref=true; touch(t); save(); render(); toast('Linked');
    });
  }
  function unlink(ri,ci){ const t=T(); t.rows[ri][ci].link=null; t.rows[ri][ci].ref=false; touch(t); save(); render(); }
  function removeTables(ids){
    ids.forEach(id=>{ delete S.tables[id]; deleted.add(id); dirty.delete(id); });
    const set=new Set(ids);
    Object.values(S.tables).forEach(t=>{ let ch=false; t.rows.forEach(r=>r.forEach(c=>{ if(c.link&&set.has(c.link)){ c.link=null; c.ref=false; ch=true; } })); if(ch) touch(t); });
    hist=hist.filter(h=>!set.has(h));
  }
  function trashTables(rootIds){
    const batch=uid(), at=now(); const all=new Set();
    rootIds.forEach(rid=>{ if(!S.tables[rid]) return; [rid,...descendants(rid)].forEach(id=>all.add(id)); });
    rootIds.forEach(rid=>{ const r=S.tables[rid]; if(!r) return; r.trashRoot=true; r.trashOrigin={refs:incoming(rid).filter(x=>!all.has(x.t.id)).map(x=>({tableId:x.t.id,r:x.ri,c:x.ci,owner:x.owner}))}; });
    all.forEach(id=>{ const t=S.tables[id]; t.trashed=at; t.trashBatch=batch; touch(t); });
    Object.values(S.tables).forEach(t=>{ if(all.has(t.id)) return; let ch=false; t.rows.forEach(r=>r.forEach(c=>{ if(c.link&&all.has(c.link)){ c.link=null; c.ref=false; ch=true; } })); if(ch) touch(t); });
    hist=hist.filter(h=>!all.has(h));
    return all.size;
  }
  function restoreBatch(batch){
    const ts=Object.values(S.tables).filter(t=>t.trashBatch===batch); if(!ts.length) return;
    ts.forEach(t=>{ delete t.trashed; delete t.trashBatch; touch(t); });
    ts.filter(t=>t.trashRoot).forEach(r=>{ let attached=false; (r.trashOrigin&&r.trashOrigin.refs||[]).forEach(x=>{ const pt=S.tables[x.tableId]; const cell=pt&&!pt.trashed&&pt.rows[x.r]&&pt.rows[x.r][x.c]; if(cell&&!cell.link){ cell.link=r.id; cell.ref=!x.owner; touch(pt); if(x.owner){ r.parent={tableId:pt.id,r:x.r,c:x.c}; attached=true; } } });
      if(!attached){ r.parent=null; } delete r.trashRoot; delete r.trashOrigin; touch(r); });
  }
  function purgeBatch(batch){ removeTables(Object.values(S.tables).filter(t=>t.trashBatch===batch).map(t=>t.id)); }
  function detach(ri,ci){
    const t=T(); const c=t.rows[ri][ci]; if(!c.link) return;
    const ids=[c.link,...descendants(c.link)];
    confirmBox('Delete sub-table?','"'+(S.tables[c.link].name||'Untitled')+'" and '+(ids.length-1)+' table(s) beneath it move to the Trash (restorable for 30 days). The cell text stays.',()=>{ trashTables([c.link]); save(); render(); toast('Moved to Trash'); },'Move to Trash');
  }
  function deleteCurrent(){
    const t=T(); if(t.id===P().root) return;
    const ids=[t.id,...descendants(t.id)];
    confirmBox('Delete this table?','"'+(t.name||'Untitled')+'" and '+(ids.length-1)+' table(s) beneath it move to the Trash (restorable for 30 days).',()=>{
      const dest=(t.parent&&S.tables[t.parent.tableId])?t.parent.tableId:P().root;
      trashTables([t.id]); S.curTable[S.cur]=dest; save(); render(); toast('Moved to Trash');

  function exportJSON(){ const q=persistable(); return JSON.stringify({projects:q.projects, tables:q.tables, exported:new Date().toISOString()},null,2); }

  function exportMarkdown(){
    const L=['# Nested Tables','','Exported '+new Date().toLocaleString(),''];
    live().forEach(p=>{
      L.push('# Project '+p.n+' · '+p.name+(p.enc?' (password-protected'+(isLocked(p)?', locked: contents not exported':', unlocked')+')':''),''); const seen=new Set(); if(isLocked(p)) return;
      function emit(id, depth, via){
        const t=S.tables[id]; if(!t) return; seen.add(id);
        L.push('#'.repeat(Math.min(depth+2,6))+' P'+t.n+' · '+(t.name||'Untitled')+' (layer '+depth+(via?', from '+via:'')+')','');
        if(t.sub&&t.sub.trim()) L.push('_'+t.sub.trim().replace(/\r?\n/g,' ')+'_','');
        L.push('| # | '+t.cols.map(esc).join(' | ')+' |'); L.push('|---|'+t.cols.map(()=>'---').join('|')+'|');
        t.rows.forEach((r,ri)=>{ L.push('| '+(ri+1)+' | '+r.map((c,ci)=>{ let s=(c.chk===true?'☑ ':c.chk===false?'☐ ':'')+esc(c.t); const k=c.link&&S.tables[c.link]; if(k) s+=(s?' ':'')+(isOwnerCell(t,ri,ci)?'↳ ':'→ ')+'[['+(k.name||'Untitled')+']]'; return s; }).join(' | ')+' |'); });
        L.push('');
        ownedChildren(id).forEach(k=>{ if(!seen.has(k.id)) emit(k.id,depth+1,(t.name||'Untitled')+' '+cellRef(t,k.ri,k.ci)); });
      }
      emit(p.root,0,null); tablesOf(p.id).forEach(t=>{ if(!seen.has(t.id)) emit(t.id,0,'unattached'); });
    });

  // ---------- Markdown / Obsidian import ----------
  function parseMarkdown(text){
    const lines=text.replace(/\r/g,'').split('\n'); let i=0; let front='';
    if(lines[0]&&lines[0].trim()==='---'){ let j=1; while(j<lines.length&&lines[j].trim()!=='---') j++; if(j<lines.length){ front=lines.slice(1,j).join('\n'); i=j+1; } }
    const root={title:null,level:0,items:[],children:[]}; const stack=[root];
    for(;i<lines.length;i++){
      const ln=lines[i]; const h=/^(#{1,6})\s*(.*?)\s*#*\s*$/.exec(ln);
      if(h){ const title=h[2].trim(); if(!title) continue; const level=h[1].length; const node={title,level,items:[],children:[]};
        while(stack.length>1&&stack[stack.length-1].level>=level) stack.pop(); stack[stack.length-1].children.push(node); stack.push(node); continue; }
      const t=ln.trim(); if(!t||t==='---') continue;
      const cb=/^[-*+]\s*\[( |x|X)\]\s*(.*)$/.exec(t); const li=/^(?:[-*+]|\d+[.)])\s+(.*)$/.exec(t);
      const cur=stack[stack.length-1];
      if(cb) cur.items.push({t:cb[2],note:'',chk:!!cb[1].trim()});
      else if(li) cur.items.push({t:li[1],note:''});
      else if(/^\|/.test(t)){ if(/^\|?\s*:?-{2,}/.test(t)) continue; cur.items.push({t:t.replace(/^\||\|$/g,'').split('|').map(x=>x.trim()).join(' · '),note:'table row'}); }
      else cur.items.push({t,note:''});
    }
    return {front,root};
  }
  function replaceFromJSON(d){ try{
      const old=Object.keys(S.tables);
      if(d.projects&&d.tables){ S={projects:d.projects, tables:d.tables, cur:Object.keys(d.projects)[0], curTable:{}, fresh:false}; }
      else if(d.tables&&d.root&&d.tables[d.root]){ S={projects:{}, tables:{}, cur:null, curTable:{}, fresh:false}; const p={id:uid(),n:1,name:'Project 1',root:d.root,u:now()}; S.projects[p.id]=p; S.cur=p.id; Object.values(d.tables).forEach(t=>{ t.p=p.id; S.tables[t.id]=t; }); }
      else throw 0;
      ensureSane(); old.forEach(id=>{ if(!S.tables[id]) deleted.add(id); }); Object.values(S.tables).forEach(t=>{ t.u=now(); dirty.add(t.id); }); touchMeta(); hist=[]; save(); render(); toast('Replaced from backup');
    }catch(e){ toast('That backup could not be read'); } }
  function mergeFromJSON(d){
    if(!(d.projects&&d.tables)){ if(d.tables&&d.root&&d.tables[d.root]){ d={projects:{x:{id:'x',n:1,name:'Imported project',root:d.root,u:now()}},tables:d.tables}; Object.values(d.tables).forEach(t=>t.p='x'); } else return toast('That is not a Nested Tables backup'); }
    const have=new Set(live().map(p=>(p.name||'').trim().toLowerCase())); let added=0, skipped=0, updated=0;
    const newest=(pid,tabs)=>Math.max(0,...Object.values(tabs).filter(t=>t.p===pid&&!t.trashed).map(t=>t.u||0));
    Object.values(d.projects).forEach(sp=>{ if(sp.trashed) return; const nm=(sp.name||'').trim().toLowerCase();
      const lp=S.projects[sp.id];
      if(lp&&!lp.enc&&!sp.enc){ // same project in both: keep whichever was edited last
        const inc=Math.max(sp.u||0,newest(sp.id,d.tables)), loc=Math.max(lp.u||0,newest(lp.id,S.tables));
        if(inc>loc+1000){ saveVersion(lp,'before update from master',{auto:true}); removeTables(tablesOf(lp.id).map(t=>t.id)); Object.values(d.tables).filter(t=>t.p===sp.id&&!t.trashed).forEach(t=>{ const c=JSON.parse(JSON.stringify(t)); S.tables[c.id]=c; dirty.add(c.id); }); lp.root=sp.root; lp.name=sp.name; lp.u=inc; if(!S.tables[S.curTable[lp.id]]) S.curTable[lp.id]=lp.root; updated++; } else skipped++;
        return; }
      if(lp||have.has(nm)){ skipped++; return; }
      const map={}; const srcT=Object.values(d.tables).filter(t=>t.p===sp.id); srcT.forEach(t=>map[t.id]=S.tables[t.id]?uid():t.id);
      const np={id:S.projects[sp.id]?uid():sp.id, n:nextProjNo(), name:sp.name||'Untitled', root:map[sp.root]||sp.root, u:now()}; if(sp.kind) np.kind=sp.kind; if(sp.enc) np.enc=sp.enc;
      srcT.forEach(t=>{ const c=JSON.parse(JSON.stringify(t)); c.id=map[t.id]; c.p=np.id; c.u=now(); if(c.parent&&map[c.parent.tableId]) c.parent.tableId=map[c.parent.tableId]; (c.rows||[]).forEach(r=>r.forEach(cell=>{ if(cell.link&&map[cell.link]) cell.link=map[cell.link]; })); S.tables[c.id]=c; dirty.add(c.id); });
      S.projects[np.id]=np; S.curTable[np.id]=np.root; added++; });
    if(added||updated){ touchMeta(); hist=[]; save(); render(); }
    toast((added?added+' added':'')+(added&&updated?', ':'')+(updated?updated+' updated from master':'')+((added||updated)?'':'Nothing newer than what is here')+(skipped?' · '+skipped+' unchanged':''));
  }
  function importLinesAsCapture(txt){
    const blocks=txt.replace(/\r/g,'').split(/\n\s*\n+/).map(b=>b.split('\n').map(l=>l.replace(/^\s*(?:[-*•▪·]|\d+[.)]|\[[ xX]\])\s*/,'').trim()).filter(Boolean)).filter(b=>b.length);
    if(!blocks.length) return toast('Nothing to import');
    const p={id:uid(), n:nextProjNo(), kind:'capture', name:'Capture: pasted · '+new Date().toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}), root:null, u:now()}; S.projects[p.id]=p;
    const mk=(name,parent,sub,lines)=>{ const t=newTable(p.id,name,parent); t.cols=['Line','Notes','Route to']; t.sub=sub||''; t.rows=lines.map(l=>[cell(l),cell(''),cell('')]); S.tables[t.id]=t; dirty.add(t.id); return t; };
    let root;
    if(blocks.length===1){ root=mk(blocks[0][0].slice(0,60),null,'Pasted text, one row per line. Type .. on any line to expand it, or → link it into a natural-language project.',blocks[0]); }
    else { root=newTable(p.id,p.name,null); root.cols=['Block','Lines','Routed to']; root.sub='Pasted text with blank lines between blocks: one sub-table per block, one row per line.'; root.rows=[]; S.tables[root.id]=root; dirty.add(root.id);
      blocks.forEach((b,i)=>{ const c=cell(b[0].slice(0,60)); const row=[c,cell(b.length+' lines'),cell('')]; root.rows.push(row); const k=mk(b[0].slice(0,60),{tableId:root.id,r:i,c:0},'Block '+(i+1)+' of the pasted text.',b); c.link=k.id; c.ref=false; }); }
    p.root=root.id; S.cur=p.id; S.curTable[p.id]=root.id; hist=[]; touchMeta(); save(); render(); toast('Capture created: '+blocks.reduce((n,b)=>n+b.length,0)+' lines');
  }
  function importMarkdownFiles(files){
    const multi=files.length>1; const pname=multi?('Import: '+files.length+' notes · '+stamp()):files[0].name.replace(/\.(md|markdown|txt)$/i,'');
    const p={id:uid(), n:nextProjNo(), name:pname, root:null, u:now()}; S.projects[p.id]=p;
    const byTitle={}; const cellsWithLinks=[];
    const WL=/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|[^\]]*)?\]\]/g;
    function mkTable(name,parent,sub){ const t=newTable(p.id,name,parent); t.cols=['Item','Notes','Link']; t.rows=[]; t.sub=sub||''; S.tables[t.id]=t; dirty.add(t.id); const k=name.trim().toLowerCase(); if(!byTitle[k]) byTitle[k]=t.id; return t; }
    function addRow(t,text,note,chk){ const c=cell(text); if(chk!==undefined) c.chk=chk; const r=[c,cell(note||''),cell('')]; t.rows.push(r); if(WL.test(text)) cellsWithLinks.push({c,text}); WL.lastIndex=0; return r; }
    function build(node,parent,sub){
      const t=mkTable(node.title,parent,sub);
      node.items.forEach(it=>addRow(t,it.t,it.note,it.chk));
      node.children.forEach(ch=>{ const r=addRow(t,ch.title,ch.items.length+' items'+(ch.children.length?' · '+ch.children.length+' sections':'')); const kt=build(ch,{tableId:t.id,r:t.rows.length-1,c:0},''); r[0].link=kt.id; r[0].ref=false; });
      if(!t.rows.length) t.rows.push([cell(),cell(),cell()]);
      return t;
    }
    let home;
    if(multi){ home=mkTable(pname,null,'Imported from '+files.length+' Markdown files. One table per file; headings nested beneath.'); }
    files.forEach(f=>{
      const {front,root}=parseMarkdown(f.text); const fname=f.name.replace(/\.(md|markdown|txt)$/i,'');
      const sub=(front?('Frontmatter: '+front.replace(/\n/g,' · ')+'. '):'')+'Imported from '+f.name+' on '+new Date().toLocaleDateString()+'.';
      // a file whose body is a single top-level heading with no loose items collapses into that heading
      let fileNode={title:fname,level:0,items:root.items,children:root.children};
      if(!root.items.length&&root.children.length===1&&root.children[0].title&&root.children[0].title.toLowerCase()!==fname.toLowerCase()) fileNode={title:fname,level:0,items:root.children[0].items,children:root.children[0].children};
      if(multi){ const r=addRow(home,fname,fileNode.items.length+' items · '+fileNode.children.length+' sections'); const ft=build(fileNode,{tableId:home.id,r:home.rows.length-1,c:0},sub); r[0].link=ft.id; }
      else { home=build(fileNode,null,sub); }
    });
    // resolve [[wikilinks]] to references
    let linked=0; cellsWithLinks.forEach(({c,text})=>{ if(c.link) return; let m; WL.lastIndex=0; while((m=WL.exec(text))){ const id=byTitle[m[1].trim().toLowerCase()]; if(id){ c.link=id; c.ref=true; linked++; break; } } });
    p.root=home.id; S.cur=p.id; S.curTable[p.id]=home.id; hist=[]; touchMeta(); save(); render();
    toast('Imported '+tablesOf(p.id).length+' tables'+(linked?' · '+linked+' wikilinks resolved':''));
  }

  async function initDb(){

        clearTimeout(timer); first=false;

          if(!Object.keys(S.projects).length){ const p={id:uid(),n:1,name:'Project 1',root:null,u:now()}; S.projects[p.id]=p; Object.values(S.tables).forEach(t=>{ if(!t.p) t.p=p.id; }); touchMeta(); }

          if(dirty.size||metaDirty) scheduleFlush();
        }
        db.doc('meta/main').onSnapshot(m=>{ if(m.metadata.hasPendingWrites) return; const d=m.exists?m.data():null; if(adoptMeta(d)){ ensureSane(); try{ localStorage.setItem(KEY,JSON.stringify(persistable())); }catch(e){} if(typing()) pendingRender=true; else render(); } }, ()=>{});
      } else if(!first){
        snap.docChanges().forEach(ch=>{
          if(ch.type==='removed'){ if(S.tables[ch.doc.id] && !dirty.has(ch.doc.id)){ removeTablesQuiet([ch.doc.id]); changed=true; } }
          else if(adoptRemote(ch.doc)) changed=true;
        });
      }
      if(!snap.metadata.hasPendingWrites) setSync('v'+APP_VERSION+' · synced','ok');
      if(changed){ ensureSane(); try{ localStorage.setItem(KEY,JSON.stringify(persistable())); }catch(e){} if(typing()) pendingRender=true; else render(); }
    }, err=>{ clearTimeout(timer); setSync('cloud off','warn'); caps.db=null; console.warn('db',err); });
    if(dirty.size||deleted.size||metaDirty) scheduleFlush();
  }

  async function downloadFile(filename,text){
    try{ await caps.downloads.save({filename, data:new Blob([text],{type:filename.endsWith('.json')?'application/json':'text/markdown'})}); toast('Saved '+filename); }
    catch(e){ try{ await caps.downloads.save({filename, data:text}); toast('Saved '+filename); }catch(e2){ toast('Download declined'); } }
  }
  let driveFolder=null; try{ driveFolder=localStorage.getItem(KEY+'-drive'); }catch(e){}
  function pickId(p){ if(!p) return null; if(typeof p==='string'){ try{ p=JSON.parse(p); }catch(e){ return null; } } if(p.id) return p.id; if(p.file&&p.file.id) return p.file.id; if(Array.isArray(p.content)){ for(const c of p.content){ const id=pickId(c.text||c); if(id) return id; } } if(p.structuredContent) return pickId(p.structuredContent); return null; }
  async function driveCall(input){ const r=await caps.mcp.callTool('Google Drive','create_file',input); return r&&(r.payload!==undefined?r.payload:r); }
  async function backupToDrive(){
    closeModal(); toast('Backing up to Drive…');
    try{
      if(!driveFolder){ const p=await driveCall({title:'Nested Tables Backups', contentMimeType:'application/vnd.google-apps.folder'}); driveFolder=pickId(p); if(driveFolder){ try{ localStorage.setItem(KEY+'-drive',driveFolder); }catch(e){} } }
      const base={disableConversionToGoogleType:true}; if(driveFolder) base.parentId=driveFolder;
      await driveCall(Object.assign({title:'Nested Tables '+stamp()+'.json', contentMimeType:'application/json', textContent:exportJSON()},base));
      await driveCall(Object.assign({title:'Nested Tables '+stamp()+'.md', contentMimeType:'text/markdown', textContent:exportMarkdown()},base));
      toast('Backed up to Drive'+(driveFolder?' (Nested Tables Backups)':''));
    }catch(e){ console.warn('drive',e); toast('Drive backup failed: '+(e&&e.code||e&&e.message||'unknown')); }
  }
  async function initCaps(){
    if(window.__standalone){ setSync('v'+APP_VERSION+' · standalone · '+live().length+' projects'); return; }
    if(!window.claude||!window.claude.use) return;
    initDb();
    try{ caps.downloads=await window.claude.use('downloads'); }catch(e){}
    try{ caps.mcp=await window.claude.use('mcp'); }catch(e){}
  }

  load(); if(pruneDefaults()) save();
  placeNav(); window.__nt={mergeFromJSON};
  (function narrowLayout(){
    const narrow=()=>window.innerWidth<=760; let done=false;
    function apply(){ if(!narrow()||done) return; done=true;
      const pn=$('phonenav'), pb=$('phonebar'), mp=$('morepanel');
      [document.querySelector('.dpad[title^="Move"]'),$('btnBack'),document.querySelector('header .zoom')].forEach(e=>e&&pn.appendChild(e));
      [$('btnCapture'),$('btnSearch'),$('btnTodo'),$('btnLock'),$('btnSave'),$('btnVer')].forEach(e=>{ if(e){ e.classList.remove('more'); pb.appendChild(e); } });
      const more=document.createElement('button'); more.id='pbMore'; more.innerHTML='<i>⋯</i><span class="lbl">More</span>'; more.onclick=()=>{ mp.classList.toggle('open'); more.classList.toggle('on',mp.classList.contains('open')); }; pb.appendChild(more);
      [$('sync'),document.querySelector('.linknav'),$('btnTree'),$('btnSnap'),$('btnGuide'),$('btnColors'),$('btnNight'),$('btnPhone'),$('btnImport'),$('btnReset'),$('btnDelete')].forEach(e=>{ if(e){ e.classList.remove('more'); mp.appendChild(e); } });
      mp.addEventListener('click',e=>{ if(e.target.closest('button')){ mp.classList.remove('open'); more.classList.remove('on'); } });
      document.addEventListener('click',e=>{ if(mp.classList.contains('open')&&!mp.contains(e.target)&&e.target!==more&&!more.contains(e.target)){ mp.classList.remove('open'); more.classList.remove('on'); } });
      $('pbNew').onclick=()=>{ const p=newProject(); S.cur=p.id; hist=[]; save(); render(); setTimeout(()=>projectModal(p),100); };
      $('btnPhone').onclick=()=>{ phone=!phone; try{ localStorage.setItem(KEY+'-phone',phone?'1':'0'); }catch(e){} renderGrid(); renderColnav(); toast(phone?'Column window: '+colN+' columns at a time':'Column window off'); };
    }
    apply(); window.addEventListener('resize',apply);
  })();
  loadVersionsAsync().then(async all=>{ const p=P(); if(!p||p.enc) return; const today=dayKey(now()); if(!all.some(v=>v.pid===p.id&&dayKey(v.ts)===today)){ lastAuto[p.id]=now(); await saveVersion(p,'auto · first of day',{auto:true}); } });
  $('btnColors').classList.toggle('off',!colorsOn);
  setZoom(zoom,true);
  render();
  initCaps();
})();
</script>
